<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>随便phone</title>

    <!-- PWA & 桌面安装 -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon.svg" />

    <!-- 样式引用 -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/dock.css" />
    <link rel="stylesheet" href="css/modal.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/modules/imessage.css" />
    <link rel="stylesheet" href="css/modules/apiSettings.css" />
    <link rel="stylesheet" href="css/modules/characters.css" />
    <link rel="stylesheet" href="css/modules/user.css" />
    <link rel="stylesheet" href="css/modules/chatRoom.css" />
    <link rel="stylesheet" href="css/modules/wallet.css" />
    <link rel="stylesheet" href="css/modules/messages.css" />
  </head>
  <body>
    <div class="phone-frame">
      <!-- 顶部状态栏 -->
      <header class="status-bar">
        <span class="status-time" id="current-time">09:41</span>
        <div class="status-icons">
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M2 20h.01M7 20v-4M12 20v-8M17 20V4" />
          </svg>
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"
            />
          </svg>
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="2" y="7" width="16" height="10" rx="2" />
            <line x1="22" y1="11" x2="22" y2="13" />
          </svg>
        </div>
      </header>

      <!-- 手机主体视口 -->
      <div class="phone-body">
        <!-- 1. CHAT (通讯中枢) -->
        <div
          id="app-chat-root"
          class="app-view-container active"
          style="flex-direction: row"
        >
          <!-- Chat 专属左侧 Dock（新增：表情包、美化、游戏、设置） -->
          <nav class="dock-nav">
            <!-- 1. 消息 -->
            <button
              class="dock-item active"
              data-target="imessage"
              title="Messages"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                ></path>
              </svg>
            </button>
            <!-- 2. 动态 -->
            <button class="dock-item" data-target="moments" title="Moments">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <polygon
                  points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"
                ></polygon>
              </svg>
            </button>
            <!-- 3. 角色 -->
            <button
              class="dock-item"
              data-target="characters"
              title="Characters"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
            </button>
            <!-- 4. 身份画像 -->
            <button class="dock-item" data-target="user" title="User">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </button>
            <!-- ✨ 5. 表情包 -->
            <button class="dock-item" data-target="stickers" title="Stickers">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                <line x1="9" y1="9" x2="9.01" y2="9"></line>
                <line x1="15" y1="9" x2="15.01" y2="9"></line>
              </svg>
            </button>
            <!-- ✨ 6. 美化 -->
            <button class="dock-item" data-target="theme" title="Theme">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
                <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                <path
                  d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.03-.23-.28-.38-.63-.38-1.01 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-5.5-4.5-9-10-9z"
                />
              </svg>
            </button>
            <!-- ✨ 7. 游戏 -->
            <button class="dock-item" data-target="games" title="Games">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="6" width="20" height="12" rx="6"></rect>
                <line x1="6" y1="12" x2="10" y2="12"></line>
                <line x1="8" y1="10" x2="8" y2="14"></line>
                <circle cx="15" cy="12" r="1" fill="currentColor"></circle>
                <circle cx="18" cy="12" r="1" fill="currentColor"></circle>
              </svg>
            </button>
                     <!-- ✨ 8. 设置 (直连系统与API配置) -->
            <button class="dock-item" data-target="settings" title="Settings">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="3"></circle>
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                ></path>
              </svg>
            </button>
            <!-- ✨ 9. 钱包 (CHAT Dock 内置板块) -->
            <button class="dock-item" data-target="wallet" title="Wallet">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                <line x1="2" y1="10" x2="22" y2="10"></line>
              </svg>
            </button>
          </nav>

          <!-- Chat 内部内容区（含新增面板） -->
          <main class="content-container">
            <section id="view-imessage" class="view-panel active"></section>
            <section id="view-moments" class="view-panel"></section>
            <section id="view-characters" class="view-panel"></section>
            <section id="view-user" class="view-panel"></section>
            <!-- ✨ 新增面板 -->
            <section id="view-stickers" class="view-panel"></section>
            <section id="view-theme" class="view-panel"></section>
            <section id="view-games" class="view-panel"></section>
            <section id="view-settings" class="view-panel"></section>
            <section id="view-wallet" class="view-panel"></section>
          </main>

        <!-- 2. API 设置 -->
        <div id="app-api-root" class="app-view-container">
          <div class="empty-placeholder">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
              <line x1="12" y1="2" x2="12" y2="6" />
              <line x1="12" y1="18" x2="12" y2="22" />
            </svg>
            <span>API Settings (In Dev)</span>
          </div>
        </div>

        <!-- 3. 美化 -->
        <div id="app-theme-root" class="app-view-container">
          <div class="empty-placeholder">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
              <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
              <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
              <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
              <path
                d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.03-.23-.28-.38-.63-.38-1.01 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-5.5-4.5-9-10-9z"
              />
            </svg>
            <span>Theme & Custom (In Dev)</span>
          </div>
        </div>

        <!-- 4. 日记 -->
        <div id="app-diary-root" class="app-view-container">
          <div class="empty-placeholder">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path
                d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
              />
            </svg>
            <span>Private Diary (In Dev)</span>
          </div>
        </div>

        <!-- ✨ 新增：短信 (放在日记下方) -->
        <div id="app-messages-root" class="app-view-container"></div>

        <!-- 5. 音乐 -->
        <div id="app-music-root" class="app-view-container">
          <div class="empty-placeholder">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <circle cx="12" cy="12" r="10" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span>Music Player (In Dev)</span>
          </div>
        </div>

        <!-- 6. 查手机 -->
        <div id="app-inspect-root" class="app-view-container">
          <div class="empty-placeholder">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
              <circle cx="12" cy="14.5" r=".5" fill="currentColor" />
            </svg>
            <span>Spy & Inspect (In Dev)</span>
          </div>
        </div>

        <!-- 7. 社交 -->
        <div id="app-social-root" class="app-view-container">
          <div class="empty-placeholder">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <circle cx="18" cy="5" r="3" />
              <circle cx="6" cy="12" r="3" />
              <circle cx="18" cy="19" r="3" />
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
            </svg>
            <span>Social Square (In Dev)</span>
          </div>
        </div>

        <!-- 8. 世界书 -->
        <div id="app-worldbook-root" class="app-view-container">
          <div class="empty-placeholder">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <circle cx="12" cy="12" r="9" />
              <ellipse cx="12" cy="12" rx="3.5" ry="9" />
            </svg>
            <span>World Book (In Dev)</span>
          </div>
        </div>

        <!-- 9. 大世界 -->
        <div id="app-overworld-root" class="app-view-container">
          <div class="empty-placeholder">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6" />
            </svg>
            <span>Overworld Map (In Dev)</span>
          </div>
        </div>

        <!-- 10. 闲鱼 -->
        <div id="app-market-root" class="app-view-container">
          <div class="empty-placeholder">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
              <circle cx="12" cy="15" r="1" />
            </svg>
            <span>Flea Market (In Dev)</span>
          </div>
        </div>

        <!-- 11. 老福特 -->
        <div id="app-lofter-root" class="app-view-container">
          <div class="empty-placeholder">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M12 19l7-7 3 3-7 7-3-3z" />
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
            </svg>
            <span>Lofter Space (In Dev)</span>
          </div>
        </div>

        <!-- 12. 你懂得 -->
        <div id="app-secret-root" class="app-view-container">
          <div class="empty-placeholder">
            <svg
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <span>Secret Vault (In Dev)</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
