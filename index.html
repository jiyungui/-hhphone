<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 核心：viewport-fit=cover 允许内容延伸至刘海与手势区 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Mini Phone</title>

    <!-- PWA & 桌面安装配置 -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- iOS Safari 专属全屏配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="MiniPhone" />
    <link rel="apple-touch-icon" href="icon.svg" />

    <!-- 样式 -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/dock.css" />
    <link rel="stylesheet" href="css/modal.css" />
    <link rel="stylesheet" href="css/modules/imessage.css" />
  </head>
  <body>
    <!-- 手机外框 (PC 显示外壳，移动端自动融入全屏) -->
    <div class="phone-frame">
      <!-- 顶部状态栏（动态高度 + 适配刘海） -->
      <header class="status-bar">
        <span class="status-time" id="current-time">09:41</span>
        <div class="status-icons">
          <!-- 信号 SVG -->
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M2 20h.01M7 20v-4M12 20v-8M17 20V4" />
          </svg>
          <!-- WiFi SVG -->
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"
            />
          </svg>
          <!-- 电量 SVG -->
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="2" y="7" width="16" height="10" rx="2" />
            <line x1="22" y1="11" x2="22" y2="13" />
          </svg>
        </div>
      </header>

      <!-- 主体视口 -->
      <div class="phone-body">
        <!-- 左侧 Dock 栏 -->
        <nav class="dock-nav">
          <button
            class="dock-item active"
            data-target="imessage"
            title="Messages"
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
              ></path>
            </svg>
            <span class="dock-badge"></span>
          </button>

          <button class="dock-item" data-target="moments" title="Moments">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <polygon
                points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"
              ></polygon>
            </svg>
          </button>

          <button class="dock-item" data-target="characters" title="Characters">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
          </button>

          <button class="dock-item" data-target="user" title="User">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
        </nav>

        <!-- 右侧动态内容视口 -->
        <main class="content-container">
          <section id="view-imessage" class="view-panel active"></section>
          <section id="view-moments" class="view-panel"></section>
          <section id="view-characters" class="view-panel"></section>
          <section id="view-user" class="view-panel"></section>
        </main>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
